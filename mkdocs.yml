site_name: Repeater registration and discovery
site_url: https://hamlink-canada.github.io/apt-rpt-docs/
repo_url: https://github.com/Hamlink-Canada/apt-rpt-docs
edit_uri: edit/main/docs/
site_description: Deployment and operation of repeater registration and DNS services
theme:
  name: mkdocs
  color_mode: auto
  user_color_mode_toggle: true
  navigation_depth: 3
plugins:
  - search
markdown_extensions:
  - tables
  - fenced_code
  - admonition
validation:
  links:
    not_found: warn
    anchors: warn
